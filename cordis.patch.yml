# dsh cordis patch for web profile — pluggable Feishu bridge + DeepSeek LLM adapter activation
# Place this at ~/.dsh/profiles/web/cordis.patch.yml
#
# IMPORTANT: never commit your real appSecret / apiKey here.
# Use environment variables instead (recommended) or fill placeholders below.

plugins:
  # 1. Activate the bundled dsh-llm-deepseek adapter (default: dormant)
  - id: llm-deepseek
    name: '@deepseek-ai/dsh-llm-deepseek'
    config:
      apiKeyEnv: DEEPSEEK_API_KEY
      baseURL: !!js process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com'
      thinking: enabled
      reasoningEffort: high
      models:
        - id: deepseek-v4-flash
          contextWindow: 128000
        - id: deepseek-v4-pro
          contextWindow: 128000

  # 2. Insert the local Feishu bridge plugin
  - insert:
      - id: feishu-bridge
        name: '@local/dsh-feishu'
        config:
          # ---- Replace with your Feishu app credentials ----
          # 1) Create a Feishu app at https://open.feishu.cn/app
          # 2) Under "Event Subscriptions", enable "im.message.receive_v1" via WebSocket
          # 3) Publish a version so the bot can actually receive events
          # 4) Copy appId + appSecret here (or use env vars, see README)
          appId: !!js process.env.FEISHU_APP_ID || 'cli_your_app_id_here'
          appSecret: !!js process.env.FEISHU_APP_SECRET || 'your_app_secret_here'
          defaultProvider: 'deepseek-official'
          defaultModel: 'deepseek-v4-flash'
